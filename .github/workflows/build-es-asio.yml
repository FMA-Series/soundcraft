name: Build ES ASIO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (libclang for the ASIO bindings)
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Locate libclang for bindgen
        shell: pwsh
        run: |
          $dirs = @("$env:LLVM_PATH\bin", "C:\Program Files\LLVM\bin")
          $found = $null
          foreach ($d in $dirs) { if (Test-Path "$d\libclang.dll") { $found = $d; break } }
          if (-not $found) {
            $hit = Get-ChildItem "C:\Program Files\LLVM" -Recurse -Filter libclang.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $found = $hit.DirectoryName }
          }
          if (-not $found) { throw "libclang.dll not found under LLVM install" }
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LIBCLANG_PATH set to $found"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build SoundCraft with ASIO
        run: cargo build --release -p soundcraft --features asio

      - name: Build the CLI
        run: cargo build --release -p soundcraft-cli

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/soundcraft.exe dist/
          Copy-Item target/release/soundcraft-cli.exe dist/
          Compress-Archive -Path dist/* -DestinationPath soundcraft-0.7.0-es-asio-windows-x64-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-es-asio-windows-x64
          path: soundcraft-0.7.0-es-asio-windows-x64-portable.zip
